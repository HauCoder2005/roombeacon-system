[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roombeacon-warehouse"
version = "0.1.0"
description = "RoomBeacon dimensional model and ClickHouse warehouse loader"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect==0.8.18",
    "duckdb==1.5.5",
    "pandas>=2.2,<4",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roombeacon_warehouse = ["sql/*.sql"]
