[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roombeacon-api"
version = "0.1.0"
description = "RoomBeacon read-only REST API over the ClickHouse warehouse"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "pydantic==2.13.5",
    "uvicorn==0.53.0",
    "clickhouse-connect==0.8.18",
    # Listing search over Silver Parquet.
    "duckdb==1.5.5",
    # Champion inference: same versions the model was trained and serialized with.
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pandas==3.0.6",
    "numpy==2.5.3",
    # Listing images from MinIO (read-only account).
    "boto3==1.43.102",
    "botocore==1.43.102",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
